  </defs>

  <rect width="800" height="470" fill="url(#wsky)"/>
  <circle cx="150" cy="110" r="48" fill="#edb441" opacity="0.9"/>

  <!-- tree trunks -->
  <g fill="#5a4632">
    <rect x="88" y="300" width="30" height="180" rx="6"/>
    <rect x="180" y="260" width="34" height="220" rx="6"/>
    <rect x="300" y="320" width="26" height="160" rx="6"/>
    <rect x="500" y="280" width="32" height="200" rx="6"/>
    <rect x="610" y="250" width="36" height="230" rx="6"/>
    <rect x="710" y="300" width="28" height="180" rx="6"/>
  </g>
  <!-- canopy -->
  <g fill="#21402f">
