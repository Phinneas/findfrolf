name: course-data-check

# Fails the build if a course file is missing required fields or violates the
# schema — runs on any change to course/city content or the check script.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/courses/**'
      - 'src/content/cities/**'
      - 'src/content.config.ts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/content/courses/**'
      - 'src/content/cities/**'
      - 'src/content.config.ts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate course data (blocks on Draft courses)
        run: npm run check:courses
      - name: Build site (blocks on schema violations)
        run: npm run build
