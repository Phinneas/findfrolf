name: course-data-check

# Validates course data and builds the site. Runs on every push to main and
# every pull request — no path filters, so any change triggers a build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate course data (blocks on Draft courses)
        run: npm run check:courses
      - name: Build site (blocks on schema violations)
        run: npm run build
